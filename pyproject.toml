# Define la configuracion inicial del proyecto

[project]
name = "asistente-correo-ia-mcp"
version = "0.1.0"
description = "Chatbot por consola con arquitectura MCP: Gmail + calculadora sesgada. Gestionado con uv."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12.0",
    "google-api-python-client>=2.170.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[project.scripts]
mcp-server = "app.mcp_server:main"
mcp-chat = "app.orchestrator:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
